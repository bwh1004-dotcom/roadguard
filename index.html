<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="로드킬 신고">
<title>로드킬 신고</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #0a0f0d;
    --card: #121a16;
    --green: #2dff7a;
    --green-dim: #1a9447;
    --orange: #ff6b2d;
    --white: #f0f5f2;
    --gray: #3a4a40;
    --text-dim: #6b8070;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 30px);
    overflow: hidden;
    position: relative;
  }

  /* Background ambient */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 80vw;
    height: 80vw;
    background: radial-gradient(circle, rgba(45,255,122,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -20%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, rgba(255,107,45,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--green);
    text-transform: uppercase;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
  }
  .status-dot::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .main-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    position: relative;
    z-index: 1;
    width: 100%;
  }

  .headline {
    text-align: center;
    margin-bottom: 44px;
  }
  .headline h1 {
    font-size: 28px;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--white);
  }
  .headline h1 span {
    color: var(--green);
  }
  .headline p {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 300;
    line-height: 1.6;
  }

  /* BIG BUTTON */
  .report-btn-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(45,255,122,0.12);
    animation: ring-expand 3s ease-out infinite;
  }
  .ring:nth-child(1) { width: 200px; height: 200px; animation-delay: 0s; }
  .ring:nth-child(2) { width: 250px; height: 250px; animation-delay: 0.8s; }
  .ring:nth-child(3) { width: 300px; height: 300px; animation-delay: 1.6s; }

  @keyframes ring-expand {
    0% { opacity: 0.5; transform: scale(0.95); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  .report-btn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1a9447, #0d5c2b);
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow:
      0 0 0 3px rgba(45,255,122,0.15),
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
    transition: all 0.15s ease;
    position: relative;
    z-index: 2;
    -webkit-user-select: none;
  }

  .report-btn:active {
    transform: scale(0.95);
    box-shadow:
      0 0 0 6px rgba(45,255,122,0.25),
      0 8px 30px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .btn-icon {
    font-size: 38px;
    line-height: 1;
  }
  .btn-text {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.05em;
  }

  /* GPS 정보 */
  .gps-card {
    background: var(--card);
    border: 1px solid var(--gray);
    border-radius: 16px;
    padding: 16px 20px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .gps-icon {
    font-size: 22px;
    flex-shrink: 0;
  }
  .gps-info {
    flex: 1;
  }
  .gps-label {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .gps-value {
    font-size: 13px;
    color: var(--white);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .gps-value.loading {
    color: var(--text-dim);
    font-size: 12px;
  }

  /* 도로 유형 */
  .road-badges {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-top: 10px;
  }
  .road-badge {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--gray);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .road-badge.active {
    border-color: var(--green);
    background: rgba(45,255,122,0.08);
  }
  .road-badge-icon { font-size: 18px; margin-bottom: 4px; }
  .road-badge-text { font-size: 10px; color: var(--text-dim); font-weight: 500; }
  .road-badge.active .road-badge-text { color: var(--green); }

  /* 결과 화면 */
  .result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,13,0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 40px 32px;
    gap: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .result-overlay.show {
    opacity: 1;
    pointer-events: all;
  }
  .result-icon {
    font-size: 64px;
    animation: bounce-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes bounce-in {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--green);
    text-align: center;
  }
  .result-body {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.8;
  }
  .result-detail {
    background: var(--card);
    border: 1px solid var(--gray);
    border-radius: 16px;
    padding: 20px 24px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
  }
  .result-row span:first-child { color: var(--text-dim); }
  .result-row span:last-child { color: var(--white); font-weight: 500; }

  .sms-preview {
    background: #0d1a11;
    border: 1px solid var(--green-dim);
    border-radius: 14px;
    padding: 14px 16px;
    width: 100%;
  }
  .sms-label {
    font-size: 10px;
    color: var(--green);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .sms-body {
    font-size: 12px;
    color: var(--text-dim);
    white-space: pre-wrap;
    font-family: 'Noto Sans KR', sans-serif;
    line-height: 1.7;
  }

  .action-btns {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .action-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 8px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.15s ease;
  }
  .action-btn:active { transform: scale(0.96); }
  .sms-btn {
    background: var(--green);
    color: #0a0f0d;
  }
  .call-btn {
    background: var(--card);
    border: 1px solid var(--gray);
    color: var(--white);
  }

  .close-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--gray);
    border-radius: 50px;
    padding: 14px 48px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    width: 100%;
  }

  .bottom-note {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding-bottom: 8px;
    line-height: 1.6;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

<!-- 결과 오버레이 -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-icon">✅</div>
  <div class="result-title">신고 완료!</div>
  <div class="result-body">담당 기관에 위치 정보가<br>전달되었습니다.</div>
  <div class="result-detail">
    <div class="result-row">
      <span>신고 시각</span>
      <span id="reportTime">—</span>
    </div>
    <div class="result-row">
      <span>위치</span>
      <span id="reportLocation">—</span>
    </div>
    <div class="result-row">
      <span>도로 유형</span>
      <span id="reportRoadType">—</span>
    </div>
    <div class="result-row">
      <span>연결 기관</span>
      <span id="reportAuthority">—</span>
    </div>
  </div>

  <div class="sms-preview">
    <div class="sms-label">📨 발송될 문자 내용</div>
    <pre id="smsBody" class="sms-body">—</pre>
  </div>

  <div class="action-btns">
    <a id="smsPhone" href="#" class="action-btn sms-btn">
      <span>💬</span><span>문자 발송</span>
    </a>
    <a id="callPhone" href="#" class="action-btn call-btn">
      <span>📞</span><span>전화 연결</span>
    </a>
  </div>

  <button class="close-btn" onclick="closeResult()">닫기</button>
</div>

<!-- 상단 -->
<div class="top-bar">
  <div class="logo">Road Guard</div>
  <div class="status-dot">대기 중</div>
</div>

<!-- 메인 -->
<div class="main-area">
  <div class="headline">
    <h1>로드킬<br><span>즉시 신고</span></h1>
    <p>버튼 하나로 담당기관에<br>GPS 위치 자동 전달</p>
  </div>

  <div class="report-btn-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <button class="report-btn" onclick="handleReport()">
      <div class="btn-icon">🐾</div>
      <div class="btn-text">신고하기</div>
    </button>
  </div>

  <!-- GPS -->
  <div class="gps-card">
    <div class="gps-icon">📍</div>
    <div class="gps-info">
      <div class="gps-label">현재 위치</div>
      <div class="gps-value loading" id="gpsValue">위치 확인 중...</div>
    </div>
  </div>

  <!-- 도로 유형 선택 -->
  <div class="road-badges" id="roadBadges">
    <div class="road-badge active" onclick="selectRoad(this, '고속도로', '한국도로공사', '1588-2504')">
      <div class="road-badge-icon">🛣️</div>
      <div class="road-badge-text">고속도로</div>
    </div>
    <div class="road-badge" onclick="selectRoad(this, '국도', '국토관리청', '1599-0001')">
      <div class="road-badge-icon">🚗</div>
      <div class="road-badge-text">국도</div>
    </div>
    <div class="road-badge" onclick="selectRoad(this, '지방도', '지자체', '120')">
      <div class="road-badge-icon">🛤️</div>
      <div class="road-badge-text">지방도</div>
    </div>
  </div>
</div>

<!-- 하단 -->
<div class="bottom-note">
  위치 정보는 신고 목적으로만 사용됩니다<br>
  긴급 상황 시 119 또는 112에 먼저 신고하세요
</div>

<script>
  let currentRoad = { type: '고속도로', authority: '한국도로공사', phone: '1588-2504' };
  let currentCoords = null;

  function selectRoad(el, type, authority, phone) {
    document.querySelectorAll('.road-badge').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentRoad = { type, authority, phone };
  }

  // GPS 가져오기
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(5);
          const lng = pos.coords.longitude.toFixed(5);
          currentCoords = { lat, lng };
          document.getElementById('gpsValue').textContent = `${lat}, ${lng}`;
          document.getElementById('gpsValue').classList.remove('loading');
        },
        () => {
          document.getElementById('gpsValue').textContent = '위치 권한을 허용해주세요';
        }
      );
    }
  }

  function handleReport() {
    if (navigator.vibrate) navigator.vibrate([50, 30, 100]);

    const now = new Date();
    const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const dateStr = now.toLocaleDateString('ko-KR');
    const locStr = currentCoords
      ? `${currentCoords.lat}, ${currentCoords.lng}`
      : '위치 정보 없음';
    const mapsLink = currentCoords
      ? `https://maps.google.com/?q=${currentCoords.lat},${currentCoords.lng}`
      : '';

    // 문자 내용 자동 완성
    const smsBody = `[로드킬 신고]\n`
      + `📅 ${dateStr} ${timeStr}\n`
      + `🛣️ 도로유형: ${currentRoad.type}\n`
      + `📍 위치: ${locStr}\n`
      + (mapsLink ? `🗺️ 지도: ${mapsLink}\n` : '')
      + `\n담당: ${currentRoad.authority}`;

    document.getElementById('reportTime').textContent = `${dateStr} ${timeStr}`;
    document.getElementById('reportLocation').textContent = locStr;
    document.getElementById('reportRoadType').textContent = currentRoad.type;
    document.getElementById('reportAuthority').textContent = `${currentRoad.authority} (${currentRoad.phone})`;
    document.getElementById('smsBody').textContent = smsBody;
    document.getElementById('smsPhone').href = `sms:01077705849&body=${encodeURIComponent(smsBody)}`;
    document.getElementById('callPhone').href = `tel:${currentRoad.phone}`;

    document.getElementById('resultOverlay').classList.add('show');
  }

  function closeResult() {
    document.getElementById('resultOverlay').classList.remove('show');
    getLocation();
  }

  // 시작
  getLocation();
</script>
</body>
</html>
