<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="로드킬 신고">
<link rel="apple-touch-icon" href="icon.png">
<title>로드킬 신고</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>emailjs.init('tWY92vfGpey8zA7Fe');</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0f0d; --card: #121a16; --green: #2dff7a;
    --green-dim: #1a9447; --red: #ff4444; --red-dim: #8b1a1a;
    --white: #f0f5f2; --gray: #3a4a40; --text-dim: #6b8070;
  }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg); color: var(--white);
    min-height: 100vh; min-height: -webkit-fill-available;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: env(safe-area-inset-top, 20px) 24px env(safe-area-inset-bottom, 30px);
    overflow: hidden; position: relative;
  }
  body::before {
    content: ''; position: fixed; top: -30%; left: -20%;
    width: 80vw; height: 80vw;
    background: radial-gradient(circle, rgba(45,255,122,0.04) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .top-bar {
    width: 100%; display: flex; justify-content: space-between;
    align-items: center; padding-top: 12px; position: relative; z-index: 1;
  }
  .logo { font-size: 11px; font-weight: 700; letter-spacing: 0.3em; color: var(--green); text-transform: uppercase; }
  .status-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .status-dot::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
  .main-area {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0; position: relative; z-index: 1; width: 100%;
  }
  .headline { text-align: center; margin-bottom: 32px; }
  .headline h1 { font-size: 26px; font-weight: 900; line-height: 1.2; letter-spacing: -0.02em; }
  .headline h1 span { color: var(--green); }
  .headline p { margin-top: 8px; font-size: 12px; color: var(--text-dim); font-weight: 300; line-height: 1.6; }
  .btn-row { display: flex; gap: 14px; width: 100%; margin-bottom: 28px; }
  .report-btn-wrap {
    flex: 1; position: relative; display: flex;
    flex-direction: column; align-items: center; gap: 10px;
  }
  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(45,255,122,0.12);
    animation: ring-expand 3s ease-out infinite;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .ring-red { border-color: rgba(255,68,68,0.15); animation: ring-expand-red 3s ease-out infinite; }
  .ring:nth-child(1){width:130px;height:130px;animation-delay:0s}
  .ring:nth-child(2){width:160px;height:160px;animation-delay:.8s}
  .ring-red:nth-child(1){width:130px;height:130px;animation-delay:0s}
  .ring-red:nth-child(2){width:160px;height:160px;animation-delay:.8s}
  @keyframes ring-expand { 0%{opacity:.5;transform:translate(-50%,-50%) scale(.95)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)} }
  @keyframes ring-expand-red { 0%{opacity:.4;transform:translate(-50%,-50%) scale(.95)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)} }
  .report-btn {
    width: 120px; height: 120px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s ease; position: relative; z-index: 2; -webkit-user-select: none;
  }
  .report-btn:active { transform: scale(0.93); }
  .report-btn:disabled { opacity: 0.6; }
  .btn-normal { background: linear-gradient(145deg, #1a9447, #0d5c2b); box-shadow: 0 0 0 3px rgba(45,255,122,0.15), 0 16px 40px rgba(0,0,0,0.5); }
  .btn-emergency { background: linear-gradient(145deg, #cc2222, #8b1a1a); box-shadow: 0 0 0 3px rgba(255,68,68,0.2), 0 16px 40px rgba(0,0,0,0.5); }
  .btn-icon { font-size: 30px; line-height: 1; }
  .btn-text { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.05em; }
  .btn-label { text-align: center; }
  .btn-label-main { font-size: 13px; font-weight: 700; color: var(--white); }
  .btn-label-sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .info-cards { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .info-card {
    background: var(--card); border: 1px solid var(--gray);
    border-radius: 16px; padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
  }
  .info-card.road-detected { border-color: var(--green-dim); }
  .card-icon { font-size: 20px; flex-shrink: 0; }
  .card-info { flex: 1; }
  .card-label { font-size: 10px; color: var(--text-dim); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
  .card-value { font-size: 13px; color: var(--white); font-weight: 500; }
  .card-value.loading { color: var(--text-dim); font-size: 12px; font-weight: 400; }
  .card-value.detected { color: var(--green); font-weight: 700; }
  .card-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .result-overlay {
    position: fixed; inset: 0; background: rgba(10,15,13,0.97);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; padding: 32px 24px; gap: 14px;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease; overflow-y: auto;
  }
  .result-overlay.show { opacity: 1; pointer-events: all; }
  .result-icon { font-size: 52px; animation: bounce-in 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  @keyframes bounce-in { 0%{transform:scale(0);opacity:0} 100%{transform:scale(1);opacity:1} }
  .result-title { font-size: 22px; font-weight: 900; text-align: center; }
  .result-title.emergency { color: var(--red); }
  .result-title.normal { color: var(--green); }
  .result-badge { padding: 6px 16px; border-radius: 50px; font-size: 11px; font-weight: 700; }
  .result-badge.emergency { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid var(--red-dim); }
  .result-badge.normal { background: rgba(45,255,122,0.1); color: var(--green); border: 1px solid var(--green-dim); }
  .email-status {
    background: var(--card); border: 1px solid var(--gray);
    border-radius: 12px; padding: 12px 16px; width: 100%;
    font-size: 12px; text-align: center; color: var(--text-dim);
  }
  .email-status.sent { border-color: var(--green-dim); color: var(--green); }
  .email-status.error { border-color: var(--red-dim); color: var(--red); }
  .result-detail {
    background: var(--card); border: 1px solid var(--gray);
    border-radius: 16px; padding: 16px 18px; width: 100%; display: flex; flex-direction: column; gap: 10px;
  }
  .result-row { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
  .result-row span:first-child { color: var(--text-dim); flex-shrink: 0; }
  .result-row span:last-child { color: var(--white); font-weight: 500; text-align: right; word-break: break-all; }
  .action-btns { display: flex; gap: 10px; width: 100%; }
  .action-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 14px 8px; border-radius: 14px;
    font-size: 13px; font-weight: 700; text-decoration: none; transition: all 0.15s ease;
  }
  .action-btn:active { transform: scale(0.96); }
  .sms-btn { background: var(--green); color: #0a0f0d; }
  .sms-btn.emergency { background: var(--red); color: #fff; }
  .call-btn { background: var(--card); border: 1px solid var(--gray); color: var(--white); }
  .close-btn {
    background: transparent; color: var(--text-dim); border: 1px solid var(--gray);
    border-radius: 50px; padding: 14px 48px; font-size: 14px; font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer; width: 100%;
  }
  .bottom-note { font-size: 11px; color: var(--text-dim); text-align: center; padding-bottom: 8px; line-height: 1.6; position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="result-overlay" id="resultOverlay">
  <div class="result-icon" id="resultIcon">✅</div>
  <div class="result-title" id="resultTitle">신고 완료!</div>
  <div class="result-badge" id="resultBadge">일반 신고</div>
  <div class="email-status" id="emailStatus">📧 이메일 전송 중...</div>
  <div class="result-detail">
    <div class="result-row"><span>신고 시각</span><span id="reportTime">—</span></div>
    <div class="result-row"><span>위치</span><span id="reportLocation">—</span></div>
    <div class="result-row"><span>도로 유형</span><span id="reportRoadType">—</span></div>
    <div class="result-row"><span>도로명</span><span id="reportRoadName">—</span></div>
    <div class="result-row"><span>담당 기관</span><span id="reportAuthority">—</span></div>
  </div>
  <div class="action-btns">
    <a id="smsPhone" href="#" class="action-btn sms-btn"><span>💬</span><span>문자 발송</span></a>
    <a id="callPhone" href="#" class="action-btn call-btn"><span>📞</span><span>전화 연결</span></a>
  </div>
  <button class="close-btn" onclick="closeResult()">닫기</button>
</div>

<div class="top-bar">
  <div class="logo">Road Guard</div>
  <div class="status-dot">대기 중</div>
</div>

<div class="main-area">
  <div class="headline">
    <h1>로드킬<br><span>즉시 신고</span></h1>
    <p>상황에 맞는 버튼 하나로<br>담당기관 + 이메일 자동 전달</p>
  </div>

  <div class="btn-row">
    <div class="report-btn-wrap">
      <div class="ring ring-red"></div>
      <div class="ring ring-red"></div>
      <button class="report-btn btn-emergency" id="btnEmergency" onclick="handleReport('emergency')">
        <div class="btn-icon">🆘</div>
        <div class="btn-text">긴급 신고</div>
      </button>
      <div class="btn-label">
        <div class="btn-label-main">살아있음</div>
        <div class="btn-label-sub">부상 동물 발견</div>
      </div>
    </div>
    <div class="report-btn-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <button class="report-btn btn-normal" id="btnNormal" onclick="handleReport('normal')">
        <div class="btn-icon">🐾</div>
        <div class="btn-text">일반 신고</div>
      </button>
      <div class="btn-label">
        <div class="btn-label-main">사체 발견</div>
        <div class="btn-label-sub">수거 요청</div>
      </div>
    </div>
  </div>

  <div class="info-cards">
    <div class="info-card">
      <div class="card-icon">📍</div>
      <div class="card-info">
        <div class="card-label">현재 위치</div>
        <div class="card-value loading" id="gpsValue">위치 확인 중...</div>
      </div>
    </div>
    <div class="info-card" id="roadCard">
      <div class="card-icon">🛣️</div>
      <div class="card-info">
        <div class="card-label">도로 유형 자동 감지</div>
        <div class="card-value loading" id="roadAutoValue">GPS 감지 후 자동 판별</div>
        <div class="card-sub" id="roadAutoSub">수동 선택 불필요</div>
      </div>
    </div>
  </div>
</div>

<div class="bottom-note">
  긴급 상황 시 119 또는 112에 먼저 신고하세요<br>
  위치 정보는 신고 목적으로만 사용됩니다
</div>

<script>
  const EMAILJS_SERVICE  = 'service_4q8jx1i';
  const EMAILJS_TEMPLATE = 'template_66qosmf';
  const RESCUE_PHONE     = '1566-1618';

  let currentRoad = { type: '확인 중', roadName: '', authority: '지자체', phone: '120' };
  let currentCoords = null;

  function classifyRoad(highway) {
    if (['motorway','motorway_link'].includes(highway))
      return { type: '고속도로', authority: '한국도로공사', phone: '1588-2504' };
    if (['trunk','trunk_link','primary','primary_link'].includes(highway))
      return { type: '국도', authority: '국토관리청', phone: '1599-0001' };
    if (['secondary','secondary_link','tertiary','tertiary_link'].includes(highway))
      return { type: '지방도', authority: '지자체', phone: '120' };
    return { type: '시도/기타', authority: '지자체', phone: '120' };
  }

  async function getLocation() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude.toFixed(5);
      const lng = pos.coords.longitude.toFixed(5);
      currentCoords = { lat, lng };
      document.getElementById('gpsValue').textContent = `${lat}, ${lng}`;
      document.getElementById('gpsValue').classList.remove('loading');
      document.getElementById('roadAutoValue').textContent = '도로 정보 조회 중...';
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=17&addressdetails=1`,
          { headers: { 'Accept-Language': 'ko' } }
        );
        const data = await res.json();
        const highway = data?.extratags?.highway || data?.type || '';
        const roadInfo = classifyRoad(highway);
        const roadName = data?.address?.road || data?.name || '';
        currentRoad = { ...roadInfo, roadName };
        document.getElementById('roadAutoValue').textContent = `${roadInfo.type}${roadName ? ' · ' + roadName : ''}`;
        document.getElementById('roadAutoValue').classList.remove('loading');
        document.getElementById('roadAutoValue').classList.add('detected');
        document.getElementById('roadAutoSub').textContent = `담당: ${roadInfo.authority} (${roadInfo.phone})`;
        document.getElementById('roadCard').classList.add('road-detected');
      } catch (e) {
        document.getElementById('roadAutoValue').textContent = '도로 정보 조회 실패';
      }
    }, () => {
      document.getElementById('gpsValue').textContent = '위치 권한을 허용해주세요';
      document.getElementById('gpsValue').classList.remove('loading');
    });
  }

  async function handleReport(type) {
    if (navigator.vibrate)
      type === 'emergency' ? navigator.vibrate([100,50,100,50,200]) : navigator.vibrate([50,30,100]);

    const isEmergency = type === 'emergency';
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const dateStr = now.toLocaleDateString('ko-KR');
    const locStr = currentCoords ? `${currentCoords.lat}, ${currentCoords.lng}` : '위치 정보 없음';
    const mapsLink = currentCoords ? `https://maps.google.com/?q=${currentCoords.lat},${currentCoords.lng}` : '';
    const phone = isEmergency ? RESCUE_PHONE : '01077705849';
    const smsBody = isEmergency
      ? `[🆘 긴급 로드킬 신고]\n📅 ${dateStr} ${timeStr}\n🛣️ ${currentRoad.type}${currentRoad.roadName ? ' (' + currentRoad.roadName + ')' : ''}\n📍 ${locStr}\n${mapsLink ? '🗺️ ' + mapsLink + '\n' : ''}\n⚠️ 살아있는 동물! 즉시 출동 요청`
      : `[🐾 로드킬 신고]\n📅 ${dateStr} ${timeStr}\n🛣️ ${currentRoad.type}${currentRoad.roadName ? ' (' + currentRoad.roadName + ')' : ''}\n📍 ${locStr}\n${mapsLink ? '🗺️ ' + mapsLink + '\n' : ''}\n담당: ${currentRoad.authority}`;

    // UI 업데이트
    document.getElementById('resultIcon').textContent = isEmergency ? '🆘' : '✅';
    document.getElementById('resultTitle').textContent = isEmergency ? '긴급 신고!' : '신고 완료!';
    document.getElementById('resultTitle').className = `result-title ${isEmergency ? 'emergency' : 'normal'}`;
    document.getElementById('resultBadge').textContent = isEmergency ? '🆘 긴급 · 부상동물' : '🐾 일반 · 사체수거';
    document.getElementById('resultBadge').className = `result-badge ${isEmergency ? 'emergency' : 'normal'}`;
    document.getElementById('smsPhone').className = `action-btn sms-btn ${isEmergency ? 'emergency' : ''}`;
    document.getElementById('reportTime').textContent = `${dateStr} ${timeStr}`;
    document.getElementById('reportLocation').textContent = locStr;
    document.getElementById('reportRoadType').textContent = currentRoad.type;
    document.getElementById('reportRoadName').textContent = currentRoad.roadName || '—';
    document.getElementById('reportAuthority').textContent = isEmergency
      ? `야생동물구조센터 (${RESCUE_PHONE})`
      : `${currentRoad.authority} (${currentRoad.phone})`;
    document.getElementById('smsPhone').href = `sms:${phone}&body=${encodeURIComponent(smsBody)}`;
    document.getElementById('callPhone').href = `tel:${isEmergency ? RESCUE_PHONE : currentRoad.phone}`;
    document.getElementById('emailStatus').textContent = '📧 이메일 전송 중...';
    document.getElementById('emailStatus').className = 'email-status';
    document.getElementById('resultOverlay').classList.add('show');

    // EmailJS 전송
    try {
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        report_type: isEmergency ? '🆘 긴급신고 (살아있는 동물)' : '🐾 일반신고 (사체수거)',
        report_time: `${dateStr} ${timeStr}`,
        road_type:   currentRoad.type,
        road_name:   currentRoad.roadName || '—',
        location:    locStr,
        maps_link:   mapsLink || '—',
        authority:   isEmergency ? `야생동물구조센터 (${RESCUE_PHONE})` : `${currentRoad.authority} (${currentRoad.phone})`
      });
      document.getElementById('emailStatus').textContent = '✅ 이메일 전송 완료 (bwh1004@gmail.com)';
      document.getElementById('emailStatus').className = 'email-status sent';
    } catch (e) {
      document.getElementById('emailStatus').textContent = '⚠️ 이메일 전송 실패 (문자로 신고하세요)';
      document.getElementById('emailStatus').className = 'email-status error';
    }
  }

  function closeResult() {
    document.getElementById('resultOverlay').classList.remove('show');
    getLocation();
  }

  getLocation();
</script>
</body>
</html>
